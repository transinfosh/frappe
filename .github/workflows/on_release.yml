name: 'Release'

on:
  release:
    types: [released]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-release-and-publish:
    name: 'Build and Publish Assets built for Releases'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          path: 'frappe'

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up bench and build assets
        run: |
          npm install -g yarn
          pip3 install -U frappe-bench
          bench -v init frappe-bench --no-procfile --no-backups --skip-assets --skip-redis-config-generation --python $(which python) --frappe-path $GITHUB_WORKSPACE/frappe
          cd frappe-bench && bench build

      - name: Package assets
        run: |
          mkdir -p $GITHUB_WORKSPACE/build
          tar -cvpzf $GITHUB_WORKSPACE/build/assets.tar.gz ./frappe-bench/sites/assets/frappe/dist

      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.1

      - name: Upload built Assets to Release
        uses: actions/upload-release-asset@v1.0.2
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: build/assets.tar.gz
          asset_name: assets.tar.gz
          asset_content_type: application/octet-stream

  tsuite-base-release:
    name: 'Trigger T-Suite Base image build on release'
    runs-on: ubuntu-latest
    permissions:
      contents: none
    container:
      image: alpine:latest
    steps:
    - name: Dispatch T-Suite Base image build
      env:
        DISPATCH_TOKEN: ${{ secrets.FRAMPE_EXT_DISPATCH_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        apk add --no-cache curl
        if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
          echo "Skipping non-Frappe release tag: $RELEASE_TAG"
          exit 0
        fi
        if [ -z "$DISPATCH_TOKEN" ]; then
          echo "::error::FRAPPE_EXT_DISPATCH_TOKEN is not configured"
          exit 1
        fi
        curl --fail-with-body --silent --show-error \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $DISPATCH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/transinfosh/frappe_ext/dispatches \
          -d "{\"event_type\":\"frappe-release\",\"client_payload\":{\"frappe_tag\":\"$RELEASE_TAG\"}}"
